name: MediTriage-Env
version: "1.0.0"
description: >
  A medical triage environment where an AI agent must simultaneously assign
  priority levels (P1–P4) and route patients (ICU/ER/Ward/Discharge) for a
  stream of incoming patients. Reward is balanced across classification
  accuracy and routing correctness, with penalties for critical delays and
  resource violations.

author: MediTriage Team
license: MIT
tags: [openenv, medical, triage, healthcare, rl, llm-agent]

environment:
  module: meditriage_env
  class: MediTriageEnv
  api:
    reset:  "reset(seed: Optional[int] = None) -> np.ndarray"
    step:   "step(action: int) -> Tuple[np.ndarray, float, bool, dict]"
    state:  "state() -> dict"
    render: "render(mode: str = 'human') -> str"

schemas:
  observation: meditriage_env.schemas.PatientObservation
  action:      meditriage_env.schemas.TriageAction
  reward:      meditriage_env.schemas.TriageReward
  state:       meditriage_env.schemas.EnvState

observation_space:
  type: Box
  shape: [29]
  low: 0.0
  high: 1.0
  dtype: float32
  schema: meditriage_env.schemas.PatientObservation

action_space:
  type: Discrete
  n: 16
  schema: meditriage_env.schemas.TriageAction
  description: >
    action = priority_index * 4 + department_index.
    priority:   0=P1_IMMEDIATE, 1=P2_EMERGENT, 2=P3_URGENT, 3=P4_NON_URGENT
    department: 0=ICU, 1=ER, 2=WARD, 3=DISCHARGE

reward:
  range: [-1.0, 1.0]
  schema: meditriage_env.schemas.TriageReward
  description: >
    Balanced reward = 0.45 * priority_score + 0.45 * department_score
                    - 0.05 * resource_penalty - 0.05 * under_triage_penalty
    Scaled by criticality: P1=2x, P2=1.5x, P3=1x, P4=0.8x.
    Partial credit given for closer priority guesses.

tasks:
  - id: easy
    description: 20 patients, clean vitals, ample resources. Learn basic triage.
    n_patients: 20
    difficulty: 0
    grader: graders.graders.easy_grader
    score_range: [0.0, 1.0]
    baseline_random:    0.02
    baseline_heuristic: 0.58
    baseline_llm_gpt4o_mini: ~0.70

  - id: medium
    description: 50 patients, noisy/missing vitals, moderate bed constraints.
    n_patients: 50
    difficulty: 1
    grader: graders.graders.medium_grader
    score_range: [0.0, 1.0]
    baseline_random:    0.05
    baseline_heuristic: 0.75
    baseline_llm_gpt4o_mini: ~0.78

  - id: hard
    description: 80 patients, high missingness, severe constraints, 25% critical edge cases.
    n_patients: 80
    difficulty: 2
    grader: graders.graders.hard_grader
    score_range: [0.0, 1.0]
    baseline_random:    0.00
    baseline_heuristic: 0.59
    baseline_llm_gpt4o_mini: ~0.65

baseline:
  script: scripts/baseline_inference.py
  api: openai
  env_vars:
    - OPENAI_API_KEY
    - OPENAI_BASE_URL   # optional
    - OPENAI_MODEL      # optional, default gpt-4o-mini
  results_file: baseline_results.json

dependencies:
  python: ">=3.9"
  packages:
    - numpy>=1.24
    - pydantic>=2.0
    - openai>=1.0

setup:
  install:       pip install -e ".[dev,demo]"
  run_baseline:  python scripts/baseline_inference.py
  run_grader: |
    from graders.graders import grade_all
    results = grade_all(your_agent_fn)
    print(results["overall_score"])
  validate:      openenv validate openenv.yaml