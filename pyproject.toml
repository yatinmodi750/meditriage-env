[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meditriage-env"
version = "1.0.0"
description = "OpenEnv medical triage environment for RL/LLM agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "openai>=1.0",
    "openenv-core>=0.2.0",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev  = ["pytest", "pyyaml"]
demo = ["gradio"]

[project.scripts]
server = "server:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["meditriage_env*", "graders*"]